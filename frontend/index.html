<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGWAPP V11.8 - Filtros Flota + Combustible</title>
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/combustible.css">
</head>
<body>
<div class="sidebar">
  <div class="logo">FGWAPP<small>Fleet Guard Web</small><span class="ver" id="ver">V11.8 FILTROS FLOTA</span></div>
  <div class="menu">
    <div class="menu-item" data-view="dashboard" onclick="switchView('dashboard')"><b>📊 Dashboard</b><i>200 LIVE</i></div>
    <div class="menu-item active" data-view="flota" onclick="switchView('flota')"><b>🚛 Flota</b><i id="m-flota">Filtros Excel Flota</i></div>
    <div class="menu-item" data-view="combustible" onclick="switchView('combustible')"><b>⛽ Combustible</b><i id="m-comb">Filtros Excel OK</i></div>
  </div>
</div>
<div class="main">
  <div class="top">
    <div class="h1">V11.8 - FILTROS FLOTA - Click header PLACA▼ MARCA▼ MODELO▼ AÑO▼ SUCURSAL▼ ESTADO▼ CONSUMO▼ -> checkbox -> tabla filtra</div>
    <button class="btn active" onclick="switchView('flota')">🚛 Flota 200</button>
    <button class="btn" onclick="switchView('combustible')">⛽ Combustible</button>
  </div>
  <div id="view-dashboard" style="display:none"><div class="kpi" style="max-width:320px"><div class="lbl">DASHBOARD</div><div class="val">200 LIVE</div></div></div>
  <div id="view-flota">
    <div style="display:flex;gap:8px;margin-bottom:10px"><span id="filtros-activos" style="font-size:11px;color:var(--muted)">Filtros Flota V11.8</span><button class="btn" onclick="limpiarFlotaFiltros()">🧹 Limpiar filtros Flota</button></div>
    <div class="card" style="padding:0;overflow:hidden"><div class="table-full-wrap"><table class="table-full"><thead id="thead-flota"></thead><tbody id="tbody"></tbody></table></div></div>
  </div>
  <div id="view-combustible" style="display:none">
    <div class="comb-grid" id="comb-stats"></div>
    <div style="display:flex;gap:8px;margin-bottom:10px"><span id="comb-info" style="font-size:11px;color:var(--muted)">Filtros Combustible</span><button class="btn" onclick="limpiarFiltrosComb()">🧹 Limpiar</button></div>
    <div class="card" style="padding:0;overflow:hidden"><div class="table-full-wrap"><table class="table-full"><thead id="thead-comb"></thead><tbody id="tbody-comb"></tbody></table></div></div>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<div class="timeline-overlay" id="timeline-overlay"><div class="timeline-modal" id="timeline-modal-inner"></div></div>
<script type="module">
import './js/dashboard.js';
import { initCombustible } from './js/combustible.js';
window.switchView=function(view){
  document.getElementById("view-dashboard").style.display=view==="dashboard"?"block":"none";
  document.getElementById("view-flota").style.display=view==="flota"?"block":"none";
  document.getElementById("view-combustible").style.display=view==="combustible"?"block":"none";
  document.querySelectorAll(".menu-item").forEach(m=>m.classList.remove("active"));
  document.querySelector(`[data-view='${view}']`)?.classList.add("active");
  if(view==="combustible"){ initCombustible(); }
};
document.getElementById("modal-overlay")?.addEventListener("click",(e)=>{ if(e.target.id==="modal-overlay") window.closeFlotaFicha(); });
document.getElementById("timeline-overlay")?.addEventListener("click",(e)=>{ if(e.target.id==="timeline-overlay") window.cerrarHistorial(); });
</script>
</body>
</html>
