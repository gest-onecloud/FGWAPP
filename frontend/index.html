<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FGWAPP V13.6.3 CLEAN</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="css/style.css?v=13.6.3"/>
</head>
<body>
<header><div><b>FGWAPP</b> V13.6.3 CLEAN</div><div style="opacity:.7">mjd-solutions.mx/FGWAPP/ | 200 Flota | 50 Choferes | Sidebar + Top</div></header>
<nav>
  <button id="btn-nav-flota" class="active" onclick="switchView('flota')">Flota (200)</button>
  <button id="btn-nav-combustible" onclick="switchView('combustible')">Combustible (1000)</button>
  <button id="btn-nav-rutas" onclick="switchView('rutas')">Rutas GPS (200 pins)</button>
  <button id="btn-nav-choferes" onclick="switchView('choferes')">Choferes (50)</button>
</nav>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-section">Mantenimiento</div>
    <button id="btn-nav-talleres" onclick="switchView('talleres')">🔧 Talleres <span class="count">5</span></button>
    <button id="btn-nav-mantenimientos" onclick="switchView('mantenimientos')">🛠 Mantenimientos <span class="count">200</span></button>
    <button id="btn-nav-proximos" onclick="switchView('proximos')">⏰ Próximos Mant</button>

    <div class="sidebar-section">Documentos</div>
    <button id="btn-nav-seguros" onclick="switchView('seguros')">🛡 Seguros <span class="count">200</span></button>
    <button id="btn-nav-impuestos" onclick="switchView('impuestos')">📄 Impuestos <span class="count">200</span></button>
    <button id="btn-nav-infracciones" onclick="switchView('infracciones')">🚨 Infracciones <span class="count">80</span></button>
    <button id="btn-nav-documentos" onclick="switchView('documentos')">📋 Estado Docs</button>

    <div class="sidebar-section">Operación</div>
    <button id="btn-nav-viajes" onclick="switchView('viajes')">🚚 Viajes <span class="count">100</span></button>
    <button id="btn-nav-gps" onclick="switchView('gps')">📡 GPS Tracking <span class="count">2000</span></button>

    <div class="sidebar-section">Analytics</div>
    <button id="btn-nav-dashboard" onclick="switchView('dashboard')">📊 Dashboard KPIs</button>
    <button id="btn-nav-flujo" onclick="switchView('flujo')">💰 Flujo Caja</button>
  </aside>

  <main class="main-content">
    <div id="view-flota" class="view"><div style="display:flex;gap:8px;padding:0 20px"><button onclick="FGWExcelFilter.clearAll('thead-flota')" style="padding:4px 10px;font-size:12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer">Limpiar filtros Flota</button></div><div id="flota-stats" class="kpis"><span id="flota-total"></span><span id="flota-operativas"></span><span id="flota-mantenimiento"></span><span id="flota-consumo-prom"></span></div><table><thead id="thead-flota"></thead><tbody id="tbody-flota"></tbody></table></div>

    <div id="view-combustible" class="view" style="display:none"><div id="comb-stats" class="kpis"></div><div id="comb-info" style="padding:0 20px;opacity:.7"></div><table><thead id="thead-comb"></thead><tbody id="tbody-comb"></tbody></table></div>

    <div id="view-rutas" class="view" style="display:none"><div id="rutas-kpis" class="kpis"></div><div id="mapa-rutas"></div><div id="rutas-lista" style="padding:10px 20px"></div><table><thead id="thead-rutas"></thead><tbody id="tbody-rutas"></tbody></table></div>

    <div id="view-talleres" class="view" style="display:none"><div id="talleres-kpis" class="kpis"></div><table><thead id="thead-talleres"></thead><tbody id="tbody-talleres"></tbody></table><div id="talleres-table-container" style="margin:10px 20px"></div></div>

    <div id="view-choferes" class="view" style="display:none"><div id="choferes-kpis" class="kpis"></div><div id="choferes-table-container" style="margin:0 20px;background:#fff;border-radius:12px;padding:10px;border:1px solid #e5e7eb"></div></div>

    <!-- NUEVAS VISTAS SIDEBAR -->
    <div id="view-mantenimientos" class="view" style="display:none"><div id="mant-kpis" class="kpis"></div><table><thead id="thead-mant"></thead><tbody id="tbody-mant"></tbody></table></div>
    <div id="view-seguros" class="view" style="display:none"><div id="seguros-kpis" class="kpis"></div><table><thead id="thead-seguros"></thead><tbody id="tbody-seguros"></tbody></table></div>
    <div id="view-impuestos" class="view" style="display:none"><div id="impuestos-kpis" class="kpis"></div><table><thead id="thead-impuestos"></thead><tbody id="tbody-impuestos"></tbody></table></div>
    <div id="view-infracciones" class="view" style="display:none"><div id="infra-kpis" class="kpis"></div><table><thead id="thead-infra"></thead><tbody id="tbody-infra"></tbody></table></div>
    <div id="view-viajes" class="view" style="display:none"><div id="viajes-kpis" class="kpis"></div><table><thead id="thead-viajes"></thead><tbody id="tbody-viajes"></tbody></table></div>
    <div id="view-gps" class="view" style="display:none"><div id="gps-kpis" class="kpis"></div><table><thead id="thead-gps"></thead><tbody id="tbody-gps"></tbody></table></div>
    <div id="view-dashboard" class="view" style="display:none"><div id="dash-kpis" class="kpis"></div><div id="dash-content" style="padding:20px">Dashboard KPIs - v_flota_dashboard, v_indicadores_flota, v_disponibilidad_vehiculos</div></div>
    <div id="view-documentos" class="view" style="display:none"><div id="doc-kpis" class="kpis"></div><div id="doc-content"></div></div>
    <div id="view-proximos" class="view" style="display:none"><div id="prox-kpis" class="kpis"></div><table><thead id="thead-prox"></thead><tbody id="tbody-prox"></tbody></table></div>
    <div id="view-flujo" class="view" style="display:none"><div id="flujo-kpis" class="kpis"></div><div id="flujo-content"></div></div>
  </main>
</div>

<div id="timeline-overlay" class="modal" onclick="if(event.target===this) this.style.display='none'"><div id="timeline-modal-inner" class="modal-inner"></div></div>
<div id="excel-panel-header"></div>

<script src="js/config.js?v=13.6.3"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js?v=13.6.3"></script>
<script src="js/util.js?v=13.6.3"></script>
<script src="js/flota.js?v=13.6.3"></script>
<script src="js/dashboard.js?v=13.6.3"></script>
<script src="js/combustible.js?v=13.6.3"></script>
<script src="js/rutas.js?v=13.6.3"></script>
<script src="js/gps.js?v=13.6.3"></script>
<script src="js/charts.js?v=13.6.3"></script>
<script src="js/talleres.js?v=13.6.3"></script>
<script src="js/excel-filter.js?v=13.6.3"></script>
<script src="js/choferes.js?v=13.6.3"></script>
<script src="js/mantenimientos.js?v=13.6.3"></script>
<script src="js/seguros.js?v=13.6.3"></script>
<script src="js/impuestos.js?v=13.6.3"></script>
<script src="js/infracciones.js?v=13.6.3"></script>
<script src="js/viajes.js?v=13.6.3"></script>
<script src="js/proximos.js?v=13.6.3"></script>
<script src="js/documentos.js?v=13.6.3"></script>
<script src="js/flujo.js?v=13.6.3"></script>
<script>
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  document.querySelectorAll('nav button, .sidebar button').forEach(b=>b.classList.remove('active'));
  const v=document.getElementById('view-'+name); if(v) v.style.display='block';
  const b=document.getElementById('btn-nav-'+name); if(b) b.classList.add('active');
  if(name==='flota') renderFlota();
  if(name==='combustible') renderCombustible();
  if(name==='rutas'){ renderRutas(); setTimeout(function(){ if(typeof mapaRutasInstance!=='undefined' && mapaRutasInstance) mapaRutasInstance.invalidateSize(); },200); }
  if(name==='talleres') renderTalleres();
  if(name==='choferes') renderChoferes();
  if(name==='mantenimientos' && typeof renderMantenimientos==='function') renderMantenimientos();
  if(name==='seguros' && typeof renderSeguros==='function') renderSeguros();
  if(name==='impuestos' && typeof renderImpuestos==='function') renderImpuestos();
  if(name==='infracciones' && typeof renderInfracciones==='function') renderInfracciones();
  if(name==='proximos' && typeof renderProximos==='function') renderProximos();
  if(name==='viajes' && typeof renderViajes==='function') renderViajes();
  if(name==='documentos' && typeof renderDocumentos==='function') renderDocumentos();
  if(name==='gps' && typeof renderGPSTracking==='function') renderGPSTracking();
  if(name==='flujo' && typeof renderFlujo==='function') renderFlujo();
  if(name==='dashboard' && typeof renderDashboardKPIs==='function') renderDashboardKPIs();
}
window.addEventListener('DOMContentLoaded',function(){ switchView('flota'); console.log('[V13.6.3] Layout Sidebar + Top OK'); });
</script>
</body>
</html>
